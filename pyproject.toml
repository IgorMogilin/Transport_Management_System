[project]
name = "transport-management-system"
version = "0.1.0"
description = "Backend сервис для автоматизации грузоперевозок"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Igor Mogilin", email = "endless8space@gmail.com"},
]
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "strenum>=0.4.15",
    "psycopg2-binary>=2.9.11"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", ".git", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "E501", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
strenum = { git = "https://github.com/irgeek/StrEnum.git" }

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff.lint.per-file-ignores]
"src/migrations/versions/*.py" = ["UP007"]
